# Default values for freecelpip
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: "" # Will be set by AZD
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "freecelpip"

serviceAccount:
  create: true
  annotations: {}
  name: "freecelpip-sa"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/api/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  hosts:
    - host: freecelpiptest.com
      paths:
        - path: /
          pathType: Prefix
    - host: www.freecelpiptest.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: freecelpip-tls
      hosts:
        - freecelpiptest.com
        - www.freecelpiptest.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - freecelpip
          topologyKey: kubernetes.io/hostname

livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Environment variables
env:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"

# Admin email (set via --set in CI/CD)
adminEmail: ""

# Secrets from Azure Key Vault
keyVault:
  enabled: true
  name: "" # Will be set by deployment
  tenantId: "" # Will be set by deployment
  clientId: "" # Will be set by deployment
  secrets:
    - name: DATABASE_URL
      key: DATABASE-URL
    - name: GOOGLE_CLIENT_ID
      key: GOOGLE-CLIENT-ID
    - name: GOOGLE_CLIENT_SECRET
      key: GOOGLE-CLIENT-SECRET
    - name: NEXTAUTH_SECRET
      key: NEXTAUTH-SECRET
    - name: NEXTAUTH_URL
      value: "https://freecelpiptest.com"
    - name: APPLICATIONINSIGHTS_CONNECTION_STRING
      key: APPLICATIONINSIGHTS-CONNECTION-STRING

# Rolling update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Pod disruption budget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 1
