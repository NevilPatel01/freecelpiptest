# Dev branch: verify production-style build (Bun).
name: Build check (dev branch)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  BUN_VERSION: "1.2.14"
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
  NEXT_PUBLIC_SITE_URL: "https://freecelpiptest.com"
  AUTH_SECRET: "ci-build-placeholder-secret-min-32-chars!!"
  NEXTAUTH_SECRET: "ci-build-placeholder-secret-min-32-chars!!"
  GOOGLE_CLIENT_ID: "ci-placeholder.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "ci-placeholder"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bunx prisma generate

      - run: bun run build
