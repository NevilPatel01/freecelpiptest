# Dev branch: verify static export build (Bun).
name: Build check (dev branch)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  BUN_VERSION: "1.2.14"
  NEXT_PUBLIC_SITE_URL: "https://freecelpiptest.com"
  NEXT_PUBLIC_APPWRITE_ENDPOINT: "https://cloud.appwrite.io/v1"
  NEXT_PUBLIC_APPWRITE_PROJECT_ID: "ci-placeholder"
  NEXT_PUBLIC_APPWRITE_DATABASE_ID: "ci-db"
  NEXT_PUBLIC_APPWRITE_NEWSLETTER_COLLECTION_ID: "newsletter"
  NEXT_PUBLIC_APPWRITE_FEEDBACK_COLLECTION_ID: "feedback"
  NEXT_PUBLIC_ADMIN_EMAIL: "admin@example.com"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun run build
