# Dev branch: verify production-style standalone build.
name: Build check (dev branch)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  NODE_VERSION: "20.x"
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
  NEXT_PUBLIC_SITE_URL: "https://freecelpiptest.com"
  AUTH_SECRET: "ci-build-placeholder-secret-min-32-chars!!"
  NEXTAUTH_SECRET: "ci-build-placeholder-secret-min-32-chars!!"
  GOOGLE_CLIENT_ID: "ci-placeholder.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "ci-placeholder"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run build
