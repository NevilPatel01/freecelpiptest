# Lint, typecheck, and production build (standalone output for Node / Docker / AKS).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION: "20.x"
  # Prisma validate/generate; no live DB required for `next build`
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npx tsc --noEmit

      - name: Build (standalone)
        env:
          AUTH_SECRET: "ci-build-placeholder-secret-min-32-chars!!"
          NEXTAUTH_SECRET: "ci-build-placeholder-secret-min-32-chars!!"
          GOOGLE_CLIENT_ID: "ci-placeholder.apps.googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "ci-placeholder"
        run: npm run build
