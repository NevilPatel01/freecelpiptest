# Lint, typecheck, and production build (Bun).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  BUN_VERSION: "1.2.14"
  # Prisma validate/generate; no live DB required for `next build`
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bunx prisma generate

      - run: bun run lint

      - run: bunx tsc --noEmit

      - name: Build (standalone)
        env:
          AUTH_SECRET: "ci-build-placeholder-secret-min-32-chars!!"
          NEXTAUTH_SECRET: "ci-build-placeholder-secret-min-32-chars!!"
          GOOGLE_CLIENT_ID: "ci-placeholder.apps.googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "ci-placeholder"
        run: bun run build
