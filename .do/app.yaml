# DigitalOcean App Platform — static site (Next.js output: export → out/)
# Routes are emitted as out/blog.html (clean URLs) plus out/blog/index.html after postbuild for hosts that only map /blog/ to a directory index.
# Docs: https://docs.digitalocean.com/products/app-platform/how-to/manage-in-app-spec/
#
# Before first deploy:
# 1. Replace YOUR_GITHUB_ORG/YOUR_REPO and branch (default: dev — active development branch).
# 2. In DO dashboard → your app → Settings → edit spec, add BUILD_TIME secrets:
#    APPWRITE_API_KEY (never commit)
# 3. Set NEXT_PUBLIC_* to match Appwrite + your live URL (see .env.example).
# 4. Appwrite Console → Auth → URLs: add https://YOUR-APP.ondigitalocean.app (and custom domain).
#
name: freecelpiptest
region: tor
static_sites:
  - name: web
    github:
      repo: NevilPatel01/freecelpiptest
      branch: dev
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    # Install Bun, then build. prebuild must run TS via `bun scripts/...` (not `tsx` — tsx breaks on DO’s Bun with ./cjs/index.cjs).
    build_command: curl -fsSL https://bun.sh/install | bash && export BUN_INSTALL="$HOME/.bun" && export PATH="$BUN_INSTALL/bin:$PATH" && bun install --frozen-lockfile && bun run build
    output_dir: out
    envs:
      - key: NODE_VERSION
        value: "20.18.0"
        scope: BUILD_TIME
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://YOUR-APP.ondigitalocean.app"
        scope: BUILD_TIME
      # Add remaining BUILD_TIME vars in DO UI (App Spec → Edit) or extend this list locally
      # (do not commit secrets): NEXT_PUBLIC_APPWRITE_*, APPWRITE_API_KEY — see .env.example
